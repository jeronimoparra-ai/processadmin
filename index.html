<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="assets/icons/redactor.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="application-name" content="ProcessAdmin">
  <meta name="author" content="Andrés Jeronimo Parra">
  <meta name="theme-color" content="#0f172a">
  <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">

  <!-- SEO -->
  <meta name="description" content="ProcessAdmin: redacta, organiza y exporta trabajos académicos con normas APA 7 completas. Guardado local en el navegador, sin servidor, sin cuenta, 100% privado.">
  <meta name="keywords" content="APA 7, trabajos académicos, redacción académica, referencias bibliográficas, exportar Word, normas APA, Colombia">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://processadmin.vercel.app">
  <meta property="og:title" content="ProcessAdmin | Redacción académica y APA 7">
  <meta property="og:description" content="Redacta, organiza y exporta trabajos académicos con normas APA 7. Sin servidor, sin cuenta, 100% privado.">
  <meta property="og:image" content="https://processadmin.vercel.app/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="es_CO">
  <meta property="og:site_name" content="ProcessAdmin">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="ProcessAdmin | Redacción académica y APA 7">
  <meta name="twitter:description" content="Herramienta académica para redactar y exportar trabajos en APA 7 desde el navegador.">
  <meta name="twitter:image" content="https://processadmin.vercel.app/og-image.png">

  <!-- Canonical -->
  <link rel="canonical" href="https://processadmin.vercel.app">

  <title>ProcessAdmin | Redacción académica y APA 7</title>

  <!-- SCHEMA.ORG -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "ProcessAdmin",
    "url": "https://processadmin.vercel.app",
    "description": "Plataforma académica para redactar, planificar, revisar y exportar trabajos con normas APA 7. Guardado local en el navegador sin servidor ni telemetría.",
    "applicationCategory": "EducationalApplication",
    "operatingSystem": "Web Browser",
    "browserRequirements": "Requires JavaScript. Requires localStorage.",
    "softwareVersion": "2.0.0",
    "inLanguage": "es-CO",
    "isAccessibleForFree": true,
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "COP"
    },
    "featureList": [
      "Centro de trabajo y avance real",
      "Planificador de estructura y objetivos",
      "Redactor académico estructurado con guardado automático",
      "Gestor de citas y referencias APA 7.ª edición",
      "Revisión objetiva y checklist pre-entrega",
      "Exportación nativa a Word (.docx) con formato APA 7 completo",
      "Mis trabajos: gestor local de documentos",
      "100% privado y local sin servidor ni cuenta de usuario"
    ],
    "author": {
      "@type": "Person",
      "name": "Andrés Jeronimo Parra",
      "email": "andresjeroparra@gmail.com",
      "affiliation": {
        "@type": "EducationalOrganization",
        "name": "Institución Universitaria Digital de Antioquia"
      }
    }
  }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Lora:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/utilities.css">

  <!-- docx.js nativo para exportación oficial a Word -->
  <script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.min.js"></script>
</head>
<body class="page-root">
  <a class="skip-link" href="#app-main">Saltar al contenido principal</a>

  <!-- Mobile sidebar overlay -->
  <div id="sidebar-overlay" class="sidebar-overlay" aria-hidden="true"></div>

  <div class="app-wrap">
    <aside id="side-panel" class="side-panel" aria-label="Navegación principal">
      <div class="brand">
        <div class="brand-inner">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="brand-mark-icon">
              <path d="M7 3.5h7.5L19 8v12.5A2.5 2.5 0 0 1 16.5 23h-9A2.5 2.5 0 0 1 5 20.5v-14A3 3 0 0 1 8 3.5z"></path>
              <path d="M14.5 3.5V8H19"></path>
              <path d="M8.5 12h7"></path>
              <path d="M8.5 15.5h7"></path>
            </svg>
          </div>
          <div>
            <h1 class="logo">ProcessAdmin</h1>
            <p class="tag">APA 7 · Redacción</p>
          </div>
        </div>
        <!-- Mobile close button -->
        <button id="sidebar-close" class="sidebar-close-btn" aria-label="Cerrar menú">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>

      <!-- Menú principal definitivo (7 áreas esenciales) -->
      <nav class="nav-list" aria-label="Navegación principal">
        <button class="nav-btn active" data-view="panel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="nav-icon"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>
          <span>Inicio</span>
        </button>

        <button class="nav-btn" data-view="planificar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="nav-icon"><path d="M4 6h16"></path><path d="M4 12h16"></path><path d="M4 18h16"></path><path d="M8 6v12"></path></svg>
          <span>Planificar</span>
        </button>

        <button class="nav-btn" data-view="redactor">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="nav-icon"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4 11.5-11.5z"></path></svg>
          <span>Redactar</span>
        </button>

        <button class="nav-btn" data-view="apa">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="nav-icon"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"></path><path d="M6 6h10"></path><path d="M6 10h10"></path></svg>
          <span>APA 7</span>
        </button>

        <button class="nav-btn" data-view="revisar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="nav-icon"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
          <span>Revisar</span>
        </button>

        <button class="nav-btn" data-view="exportar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="nav-icon"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="18" x2="12" y2="12"></line><line x1="9" y1="15" x2="12" y2="12"></line><line x1="15" y1="15" x2="12" y2="12"></line></svg>
          <span>Exportar</span>
        </button>

        <button class="nav-btn" data-view="trabajos">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="nav-icon"><path d="M4 7h16"></path><path d="M4 12h16"></path><path d="M4 17h10"></path><path d="M18 17v-6"></path><path d="M15 14l3 3 3-3"></path></svg>
          <span>Mis trabajos</span>
        </button>
      </nav>

      <!-- Pie de página del sidebar: acceso secundario a Legal, Acerca y contador -->
      <div class="side-footer">
        <div class="side-footer-row">
          <button class="nav-btn nav-btn--subtle" data-view="legal">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="nav-icon"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
            <span>Legal</span>
          </button>
          <button class="nav-btn nav-btn--subtle" data-view="acerca">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nav-icon">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <span>Acerca</span>
          </button>
        </div>
        <div class="side-meta">
          <span id="saved-document-count" class="side-meta-count">0</span>
          <span class="side-meta-label">trabajos guardados</span>
        </div>
      </div>
    </aside>

    <main id="app-main" class="main-area" tabindex="-1">
      <header class="workspace-header">
        <div class="header-inner">
          <div class="header-left">
            <button id="sidebar-toggle" class="sidebar-toggle-btn" aria-label="Abrir menú">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            <div>
              <h2 id="header-title" class="header-title">Inicio</h2>
              <p id="header-subtitle" class="header-subtitle">Centro de trabajo y avance real del documento</p>
            </div>
          </div>
          <div class="header-pills">
            <div class="header-pill header-pill--success" title="Los cambios se guardan localmente en tu navegador">
              <svg id="save-indicator" class="header-pill-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                <path d="M7 3v6h10"></path>
                <path d="M8 21v-8h8v8"></path>
              </svg>
              <span class="hidden sm:inline">Guardado</span>
            </div>
          </div>
        </div>
      </header>

      <section class="content-area">
        <div id="main-workspace" class="workspace p-4 md:p-8">
          <!-- El enrutador JS renderiza la vista activa aquí -->
          <div id="workspace-loader" class="flex flex-col items-center justify-center min-h-[400px] gap-4 text-slate-400">
            <div class="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
            <p class="text-base font-medium text-slate-700">Cargando ProcessAdmin...</p>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- Script principal modular de la aplicación -->
  <script type="module" src="src/app/main.js"></script>
</body>
</html>
